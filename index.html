<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Grille Collaborative</title>
  <link rel="stylesheet" href="css/style.css">
  
  
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #1e1e1e;
    }
    #board {
      display: block;
      cursor: grab;
    }
    #board:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <h1>Grille de Pixels</h1>
  

  <canvas id="board"></canvas>


  <script src="/socket.io/socket.io.js"></script>
  <script src="js/app.js"></script>

  
  <script>
    // Connexion 
    const socket = io();

    socket.on('connect', () => {
      console.log('Connecté au serveur !');
    });

    socket.on('PIXEL_UPDATE', (data) => {
      if (data && data.x !== undefined && data.y !== undefined && data.color) {
        setPixel(data.x, data.y, data.color);
      }
    });

    // Initialisation du Canvas
    const CANVAS_SIZE = 1000;
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');

    const buffer = document.createElement('canvas');
    buffer.width = CANVAS_SIZE;
    buffer.height = CANVAS_SIZE;
    const bufferCtx = buffer.getContext('2d');

    // Caméra (position et zoom)
    let camera = {
      x: 0,
      y: 0,
      zoom: 1,
      minZoom: 0.1,
      maxZoom: 50
    };

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      render();
    }
    window.addEventListener('resize', resizeCanvas);
