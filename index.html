<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Pixel World</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="game-container" class="blurred">
    <header>
        <h1>Pixel World</h1>
        <p>Statut : <span id="status" class="status">Connexion...</span> | Joueurs : <span id="count">0</span> <span id="admin-badge" class="badge-admin hidden">[HÔTE]</span></p>
    </header>

</body>

<div id="admin-panel" class="hidden">
    <h3>Gestion Joueurs (Admin)</h3>
    <ul id="admin-user-list"></ul>
</div>

<div id="leaderboard">
    <h3>Classement</h3>
    <ol id="leaderboard-list"></ol>
</div>

<div id="reference-panel" class="hidden pos-right">
    <div class="panel-header">
        <span>Modèle</span>
        <div class="panel-actions">
            <button id="btn-toggle-side" type="button" title="Changer de côté">⇄</button>
            <button id="btn-close-ref" type="button" title="Fermer">✕</button>
        </div>
    </div>
    <img id="reference-image" alt="Référence">
</div>

</html>
