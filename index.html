<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Pixel World</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="game-container" class="blurred">
    <header>
        <h1>Pixel World</h1>
        <p>Statut : <span id="status" class="status">Connexion...</span> | Joueurs : <span id="count">0</span> <span id="admin-badge" class="badge-admin hidden">[HÔTE]</span></p>
    </header>

    <div id="admin-panel" class="hidden">
        <h3>Gestion Joueurs (Admin)</h3>
        <ul id="admin-user-list"></ul>
    </div>

    <div id="leaderboard">
        <h3>Classement</h3>
        <ol id="leaderboard-list"></ol>
    </div>

    <!-- Panneau de contrôle du calque de décalque -->
    <div id="reference-panel" class="hidden">
      <div class="panel-header">
        <span>Calque de référence</span>
        <button id="btn-close-ref" type="button" title="Fermer">✕</button>
      </div>
      <div class="overlay-controls">
        <label>Opacité <input type="range" id="ref-opacity" min="0.1" max="1" step="0.05" value="0.5"></label>
        <label>Taille (cases) <input type="number" id="ref-size" min="5" max="400" value="50"></label>
        <label>Position X <input type="number" id="ref-pos-x" min="0" max="399" value="0"></label>
        <label>Position Y <input type="number" id="ref-pos-y" min="0" max="399" value="0"></label>
      </div>
    </div>

    <main>
        <canvas id="gameCanvas" width="800" height="800"></canvas>
    </main>
</div>

<div id="color-context-menu" class="context-menu hidden">
    <div class="menu-row">
        <div class="color-preview" id="color-preview"></div>
        <button type="button" id="btn-favorite" title="Ajouter aux favoris">♥</button>
    </div>

    <!-- Champ de collage Hex / RGB -->
    <input 
      type="text" 
      id="color-hex-input" 
      placeholder="#FFFFFF ou rgb(...)" 
      autocomplete="off" 
      spellcheck="false"
    />

    <div class="rgb-sliders">
        <label>R <input type="range" id="slider-r" min="0" max="255" value="0"></label>
        <label>G <input type="range" id="slider-g" min="0" max="255" value="0"></label>
        <label>B <input type="range" id="slider-b" min="0" max="255" value="0"></label>
    </div>

    <div class="section-title">Palette</div>
    <div class="color-palette" id="color-palette"></div>

    <div class="section-title">Favoris</div>
    <div class="color-palette" id="favorite-palette"></div>

    <div class="section-title">Forme rapide</div>
    <div class="shape-buttons">
        <button type="button" class="btn-tool active" data-tool="pixel">Pixel</button>
        <button type="button" class="btn-tool" data-tool="square" data-size="3">Carré 3</button>
        <button type="button" class="btn-tool" data-tool="square" data-size="5">Carré 5</button>
        <button type="button" class="btn-tool" data-tool="square" data-size="10">Carré 10</button>
        <button type="button" class="btn-tool" data-tool="circle" data-size="2">Rond 5</button>
        <button type="button" class="btn-tool" data-tool="circle" data-size="4">Rond 9</button>
    </div>

    <div class="section-title">Aide au dessin</div>
    <label class="file-upload-btn">
        Importer un modèle
        <input type="file" id="image-loader" accept="image/*">
    </label>

    <button type="button" id="btn-select-color">Fermer</button>
</div>

<div id="login-modal" class="modal-overlay">
    <div class="modal-card">
        <h2>Rejoindre la partie</h2>
        <div id="login-form">
            <input
                    type="text"
                    id="username-input"
                    placeholder="Pseudo (3 à 20 caractères)"
                    minlength="3"
                    maxlength="20"
                    autocomplete="off"
            />
            <button type="button" id="btn-login">Entrer</button>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
