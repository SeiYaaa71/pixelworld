<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Canevas partagé - Grille de Pixels</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #1e1e1e;
      font-family: sans-serif;
    }
    #board {
      display: block;
      cursor: crosshair;
    }
    #board.grabbing {
      cursor: grabbing;
    }
  </style>
</head>
<body>

  <canvas id="board"></canvas>

  <!-- Interface Utilisateur -->
  <div class="readout">
    <span id="coords">—</span> · <b id="zoom">1×</b>
  </div>

  <div class="banner" id="connection" hidden></div>

  <div class="dock">
    <div class="swatches" id="swatches" role="group" aria-label="Couleurs"></div>
    <div class="cooldown">
      <div class="status" id="status">Chargement</div>
      <div class="cooldown-track">
        <div class="cooldown-fill" id="cooldown-fill"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Scripts -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    // Connexion WebSocket
    const socket = io();

    socket.on('connect', () => {
      console.log('Connecté au serveur !');
    });

    socket.on('PIXEL_UPDATE', (data) => {
      if (data && data.x !== undefined && data.y !== undefined && data.color) {
        setPixel(data.x, data.y, data.color);
      }
    });

    // Initialisation du Canvas
    const CANVAS_SIZE = 1000;
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');

    const buffer = document.createElement('canvas');
    buffer.width = CANVAS_SIZE;
    buffer.height = CANVAS_SIZE;
    const bufferCtx = buffer.getContext('2d');

    // Caméra (position et zoom)
    let camera = {
      x: 0,
      y: 0,
      zoom: 1,
      minZoom: 0.1,
      maxZoom: 50
    };

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      render();
    }
    window.addEventListener('resize', resizeCanvas);

    function initBoard(imageDataOrUrl) {
      bufferCtx.fillStyle = '#ffffff';
      bufferCtx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

      if (imageDataOrUrl) {
        if (typeof imageDataOrUrl === 'string') {
          const img = new Image();
          img.onload = () => {
            bufferCtx.drawImage(img, 0, 0, CANVAS_SIZE, CANVAS_SIZE);
            render();
          };
          img.src = imageDataOrUrl;
        } else if (imageDataOrUrl instanceof ImageData) {
          bufferCtx.putImageData(imageDataOrUrl, 0, 0);
        }
      }

      // Centrage initial de la grille
      camera.x = (canvas.width - CANVAS_SIZE * camera.zoom) / 2;
      camera.y = (canvas.height - CANVAS_SIZE * camera.zoom) / 2;

      render();
    }

    function setPixel(x, y, color) {
      if (x < 0 || x >= CANVAS_SIZE || y < 0 || y >= CANVAS_SIZE) return;
      bufferCtx.fillStyle = color;
      bufferCtx.fillRect(x, y, 1, 1);
      render();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.translate(camera.x, camera.y);
      ctx.scale(camera.zoom, camera.zoom);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(buffer, 0, 0);
      ctx.restore();

      // Mise à jour de l'affichage du zoom dans le HUD
      const zoomEl = document.getElementById('zoom');
      if (zoomEl) zoomEl.textContent = `${camera.zoom.toFixed(1)}×`;
    }

    // Déplacement (Clic droit ou Molette enfoncée) et Zoom
    let isDragging = false;
    let startX = 0, startY = 0;

    // Désactive le menu contextuel du clic droit pour permettre le glisser
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    canvas.addEventListener('mousedown', (e) => {
      // Bouton 1 = Molette, Bouton 2 = Clic Droit pour déplacer la caméra
      if (e.button === 1 || e.button === 2) {
        isDragging = true;
        canvas.classList.add('grabbing');
        startX = e.clientX - camera.x;
        startY = e.clientY - camera.y;
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (isDragging) {
        camera.x = e.clientX - startX;
        camera.y = e.clientY - startY;
        render();
      }

      // Calcul et affichage des coordonnées X, Y
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const gridX = Math.floor((mouseX - camera.x) / camera.zoom);
      const gridY = Math.floor((mouseY - camera.y) / camera.zoom);

      const coordsEl = document.getElementById('coords');
      if (coordsEl) {
        if (gridX >= 0 && gridX < CANVAS_SIZE && gridY >= 0 && gridY < CANVAS_SIZE) {
          coordsEl.textContent = `${gridX}, ${gridY}`;
        } else {
          coordsEl.textContent = '—';
        }
      }
    });

    window.addEventListener('mouseup', (e) => {
      if (e.button === 1 || e.button === 2) {
        isDragging = false;
        canvas.classList.remove('grabbing');
      }
    });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
      const newZoom = Math.min(Math.max(camera.zoom * zoomFactor, camera.minZoom), camera.maxZoom);

      const mouseX = e.clientX;
      const mouseY = e.clientY;

      camera.x = mouseX - (mouseX - camera.x) * (newZoom / camera.zoom);
      camera.y = mouseY - (mouseY - camera.y) * (newZoom / camera.zoom);
      camera.zoom = newZoom;

      render();
    }, { passive: false });

    // Lancement
    resizeCanvas();
    initBoard();
  </script>
</body>
</html>
